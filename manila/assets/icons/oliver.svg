<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"
     role="img" aria-labelledby="title desc">
  <title id="title">Oliver</title>
  <desc id="desc">A happy warm-gray Weimaraner with long floppy ears,
    large brown eyes, a broad dark nose, and a coral tongue.</desc>

  <!-- Long pendant ears define the silhouette, even at favicon size. -->
  <g id="ears" fill="#a99b8e" stroke="#382315" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round">
    <path id="ear-left" d="M 43 21
      C 30 12 22 22 16 36 C 11 48 4 54 6 68
      C 7 79 16 80 17 90 C 19 101 28 98 33 87
      C 40 74 40 39 43 21 Z"/>
    <path id="ear-right" transform="translate(128 0) scale(-1 1)" d="M 43 21
      C 30 12 22 22 16 36 C 11 48 4 54 6 68
      C 7 79 16 80 17 90 C 19 101 28 98 33 87
      C 40 74 40 39 43 21 Z"/>
  </g>

  <path id="head" fill="#c8bbb0" stroke="#382315" stroke-width="3"
        stroke-linejoin="round" d="M 32 29
    C 34 15 48 9 64 9 C 80 9 94 15 96 29
    C 101 44 100 68 94 83 C 88 96 84 103 79 113
    C 73 123 55 123 49 113 C 44 103 40 96 34 83
    C 28 68 27 44 32 29 Z"/>

  <g id="eyes" stroke="#382315" stroke-width="3">
    <ellipse id="eye-left" cx="45" cy="48" rx="10" ry="14" fill="#fff3d6"/>
    <ellipse id="eye-right" cx="83" cy="48" rx="10" ry="14" fill="#fff3d6"/>
    <ellipse cx="47" cy="50" rx="6.5" ry="10" fill="#d18419"/>
    <ellipse cx="81" cy="50" rx="6.5" ry="10" fill="#d18419"/>
    <ellipse id="pupil-left" cx="47" cy="51" rx="4" ry="7.5" fill="#382315" stroke="none"/>
    <ellipse id="pupil-right" cx="81" cy="51" rx="4" ry="7.5" fill="#382315" stroke="none"/>
  </g>
  <g id="eye-highlights" fill="#fff3d6">
    <circle cx="49" cy="45" r="2.5"/>
    <circle cx="83" cy="45" r="2.5"/>
  </g>
  <g id="brows" fill="none" stroke="#382315" stroke-width="3"
     stroke-linecap="round">
    <path d="M 36 29 Q 44 20 52 27"/>
    <path d="M 76 27 Q 84 20 92 29"/>
  </g>

  <!-- The smile and tongue stay broad; no tiny teeth or whisker dots. -->
  <path id="mouth" fill="#382315" d="M 42 77
    Q 64 88 86 77 L 80 99 C 77 120 51 120 48 99 Z"/>
  <path id="tongue" fill="#f5754d" d="M 53 97
    Q 58 93 64 98 Q 70 93 75 97 L 75 104
    C 75 117 53 117 53 104 Z"/>
  <path id="tongue-crease" fill="none" stroke="#382315" stroke-width="2"
        stroke-linecap="round" d="M 64 99 V 104"/>

  <path id="muzzle" fill="#ded2c4" stroke="#382315" stroke-width="3"
        stroke-linejoin="round" d="M 64 57
    C 54 57 50 65 44 69 C 36 74 39 87 48 91
    C 54 94 59 91 64 88 C 69 91 74 94 80 91
    C 89 87 92 74 84 69 C 78 65 74 57 64 57 Z"/>
  <path id="nose" fill="#382315" d="M 64 64
    C 52 64 49 68 51 74 C 53 80 59 83 64 84
    C 69 83 75 80 77 74 C 79 68 76 64 64 64 Z"/>
  <path id="smile" fill="none" stroke="#382315" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"
        d="M 64 82 V 88 M 41 77 C 44 91 54 95 64 88
           C 74 95 84 91 87 77"/>
</svg>
